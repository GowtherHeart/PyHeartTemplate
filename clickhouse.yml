version: '3'
services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=root
      - CLICKHOUSE_PASSWORD=password
      # - TCP_CONNECTION_LIMIT_REACHED=10000

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    volumes:
      # Монтируем каталог с нашими доп. конфигами
      # - ./config.d:/etc/clickhouse-server/config.d
      # (опционально) логи и данные
      - ./ch_data:/var/lib/clickhouse
      - ./ch_logs:/var/log/clickhouse-server
